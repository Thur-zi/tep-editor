    <ellipse cx="38" cy="46" rx="11" ry="13" fill="#f6c6a3"/>
    <!-- franja lateral -->
    <path d="M26 44 C25 31 37 27 47 31 C51 33 52 38 51 42 C46 35 37 34 30 40 C29 41 27 43 26 44 Z" fill="#5a2e1b"/>
