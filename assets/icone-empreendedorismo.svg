    <circle cx="34" cy="47" r="1.4" fill="#231f20"/>
    <circle cx="42.5" cy="47" r="1.4" fill="#231f20"/>
    <path d="M34.5 53 C36.5 55.5 40 55.5 42 53" fill="none" stroke="#c8344a" stroke-width="1.8" stroke-linecap="round"/>
    <!-- brincos -->
    <circle cx="27" cy="51" r="2" fill="#f2b705"/>
    <circle cx="49" cy="51" r="2" fill="#f2b705"/>
