  <circle cx="50" cy="50" r="46" fill="#fff" stroke="#f26532" stroke-width="3"/>
  <g clip-path="url(#c)">
    <!-- gráfico de crescimento -->
    <rect x="66" y="58" width="6" height="20" rx="1.5" fill="#178f7f"/>
    <rect x="75" y="49" width="6" height="29" rx="1.5" fill="#178f7f"/>
    <rect x="84" y="40" width="6" height="38" rx="1.5" fill="#178f7f"/>
    <polyline points="63,50 72,42 78,45 88,31" fill="none" stroke="#231f20" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="83,29 91,27 90,35" fill="#231f20"/>
    <!-- cabelo longo (atrás) -->
    <path d="M20 44 C18 22 56 18 56 42 C57 54 60 64 64 72 L16 72 C19 64 21 54 20 44 Z" fill="#5a2e1b"/>
    <!-- blusa com decote em V -->
